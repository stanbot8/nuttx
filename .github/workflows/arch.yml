# Identify the Arch for the PR and select the applicable builds
name: Arch

on:
  workflow_call:
    inputs:
      os:
        description: "Operating System hosting the build: Linux, macOS or msys2"
        required: true
        type: string
      boards:
        description: "List of All Builds: [arm-01, risc-v-01, xtensa-01, ...]"
        required: true
        type: string
    outputs:
      skip_all_builds:
        description: "Set to 1 if all builds should be skipped"
        value: ${{ jobs.Select-Builds.outputs.skip_all_builds }}
      selected_builds:
        description: "Selected Builds for the PR: [arm-01, risc-v-01, xtensa-01, ...]"
        value: ${{ jobs.Select-Builds.outputs.selected_builds }}

jobs:
  Select-Builds:
    runs-on: ubuntu-latest

    outputs:
      skip_all_builds: ${{ steps.select-builds.outputs.skip_all_builds }}
      selected_builds: ${{ steps.select-builds.outputs.selected_builds }}

    steps:

      # Get the Arch for the PR: arm, arm64, risc-v, xtensa, ...
      - name: Get arch
        id: get-arch
        run: |2

          # If PR is Not Created or Modified: Build all targets
          pr=${{github.event.pull_request.number}}
          if [[ "$pr" == "" ]]; then
            echo "Not a Created or Modified PR, will build all targets"
            exit
          fi

          # Ignore the Label "Area: Documentation", because it won't affect the Build Targets
          query='.labels | map(select(.name != "Area: Documentation")) | '
          select_name='.[].name'
          select_length='length'

          # Get the Labels for the PR: "Arch: risc-v \n Board: risc-v \n Size: XS"
          # If GitHub CLI Fails: Build all targets
          labels=$(gh pr view $pr --repo $GITHUB_REPOSITORY --json labels --jq "$query$select_name" || echo "")
          numlabels=$(gh pr view $pr --repo $GITHUB_REPOSITORY --json labels --jq "$query$select_length" || echo "")
          echo "labels=$labels"
          echo "numlabels=$numlabels" | tee -a $GITHUB_OUTPUT

          # Identify the Size, Arch and Board Labels
          if [[ "$labels" == *"Size: "* ]]; then
            echo 'labels_contain_size=1' | tee -a $GITHUB_OUTPUT
          fi
          if [[ "$labels" == *"Arch: "* ]]; then
            echo 'labels_contain_arch=1' | tee -a $GITHUB_OUTPUT
          fi
          if [[ "$labels" == *"Board: "* ]]; then
            echo 'labels_contain_board=1' | tee -a $GITHUB_OUTPUT
          fi

          # Get the Arch Label
          if [[ "$labels" == *"Arch: arm64"* ]]; then
            echo 'arch_contains_arm64=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: arm"* ]]; then
            echo 'arch_contains_arm=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: risc-v"* ]]; then
            echo 'arch_contains_riscv=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: simulator"* ]]; then
            echo 'arch_contains_sim=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: x86_64"* ]]; then
            echo 'arch_contains_x86_64=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: x86"* ]]; then
            echo 'arch_contains_x86=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Arch: xtensa"* ]]; then
            echo 'arch_contains_xtensa=1' | tee -a $GITHUB_OUTPUT
          fi

          # Get the Board Label
          if [[ "$labels" == *"Board: arm64"* ]]; then
            echo 'board_contains_arm64=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: arm"* ]]; then
            echo 'board_contains_arm=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: risc-v"* ]]; then
            echo 'board_contains_riscv=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: simulator"* ]]; then
            echo 'board_contains_sim=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: x86_64"* ]]; then
            echo 'board_contains_x86_64=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: x86"* ]]; then
            echo 'board_contains_x86=1' | tee -a $GITHUB_OUTPUT
          elif [[ "$labels" == *"Board: xtensa"* ]]; then
            echo 'board_contains_xtensa=1' | tee -a $GITHUB_OUTPUT
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Select the Builds for the PR: arm-01, risc-v-01, xtensa-01, ...
      - name: Select builds
        id: select-builds
        run: |2

          # Skip all macOS Builds
          if [[ "${{ inputs.os }}" == "macOS" ]]; then
            echo "Skipping all macOS Builds"
            echo "skip_all_builds=1" | tee -a $GITHUB_OUTPUT
            exit
          fi

          # Fetch the outputs from the previous step
          numlabels=${{ steps.get-arch.outputs.numlabels }}
          labels_contain_size=${{ steps.get-arch.outputs.labels_contain_size }}
          labels_contain_arch=${{ steps.get-arch.outputs.labels_contain_arch }}
          labels_contain_board=${{ steps.get-arch.outputs.labels_contain_board }}
          arch_contains_arm=${{ steps.get-arch.outputs.arch_contains_arm }}
          arch_contains_arm64=${{ steps.get-arch.outputs.arch_contains_arm64 }}
          arch_contains_riscv=${{ steps.get-arch.outputs.arch_contains_riscv }}
          arch_contains_sim=${{ steps.get-arch.outputs.arch_contains_sim }}
          arch_contains_x86=${{ steps.get-arch.outputs.arch_contains_x86 }}
          arch_contains_x86_64=${{ steps.get-arch.outputs.arch_contains_x86_64 }}
          arch_contains_xtensa=${{ steps.get-arch.outputs.arch_contains_xtensa }}
          board_contains_arm=${{ steps.get-arch.outputs.board_contains_arm }}
          board_contains_arm64=${{ steps.get-arch.outputs.board_contains_arm64 }}
          board_contains_riscv=${{ steps.get-arch.outputs.board_contains_riscv }}
          board_contains_sim=${{ steps.get-arch.outputs.board_contains_sim }}
          board_contains_x86=${{ steps.get-arch.outputs.board_contains_x86 }}
          board_contains_x86_64=${{ steps.get-arch.outputs.board_contains_x86_64 }}
          board_contains_xtensa=${{ steps.get-arch.outputs.board_contains_xtensa }}

          # inputs.boards is a JSON Array: ["arm-01", "risc-v-01", "xtensa-01", ...]
          # We compact and remove the newlines
          boards=$( echo '${{ inputs.boards }}' | jq --compact-output ".")
          numboards=$( echo "$boards" | jq "length" )

          # We consider only Simple PRs with:
          # Arch + Size Labels Only
          # Board + Size Labels Only
          # Arch + Board + Size Labels Only
          if [[ "$labels_contain_size" != "1" ]]; then
            echo "Size Label Missing, will build all targets"
            quit=1
          elif [[ "$numlabels" == "2" && "$labels_contain_arch" == "1" ]]; then
            echo "Arch + Size Labels Only"
          elif [[ "$numlabels" == "2" && "$labels_contain_board" == "1" ]]; then
            echo "Board + Size Labels Only"
          elif [[ "$numlabels" == "3" && "$labels_contain_arch" == "1"  && "$labels_contain_board" == "1" ]]; then
            # Arch and Board must be the same
            if [[
              "$arch_contains_arm" != "$board_contains_arm" ||
              "$arch_contains_arm64" != "$board_contains_arm64" ||
              "$arch_contains_riscv" != "$board_contains_riscv" ||
              "$arch_contains_sim" != "$board_contains_sim" ||
              "$arch_contains_x86" != "$board_contains_x86" ||
              "$arch_contains_x86_64" != "$board_contains_x86_64" ||
              "$arch_contains_xtensa" != "$board_contains_xtensa"
            ]]; then
              echo "Arch and Board are not the same, will build all targets"
              quit=1
            else
              echo "Arch + Board + Size Labels Only"
            fi
          else
            echo "Not a Simple PR, will build all targets"
            quit=1
          fi

          # If Not a Simple PR: Build all targets
          if [[ "$quit" == "1" ]]; then
            # If PR was Created or Modified: Include all boards
            pr=${{github.event.pull_request.number}}
            if [[ "$pr" != "" ]]; then
              echo "Include all boards"
              boards=$(
                echo '${{ inputs.boards }}' |
                jq --compact-output \
                '.'
              )
            fi
            echo "selected_builds=$boards" | tee -a $GITHUB_OUTPUT
            exit
          fi

          # For every board
          for (( i=0; i<numboards; i++ ))
          do
            # Fetch the board
            board=$( echo "$boards" | jq ".[$i]" )
            skip_build=0

            # For "Arch / Board: arm": Build arm-01, arm-02, ...
            if [[ "$arch_contains_arm" == "1" || "$board_contains_arm" == "1" ]]; then
              if [[ "$board" != *"arm-"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: arm64": Build arm64-01
            elif [[ "$arch_contains_arm64" == "1" || "$board_contains_arm64" == "1" ]]; then
              if [[ "$board" != *"arm64-"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: risc-v": Build risc-v-01, risc-v-02, ...
            elif [[ "$arch_contains_riscv" == "1" || "$board_contains_riscv" == "1" ]]; then
              if [[ "$board" != *"risc-v-"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: simulator": Build sim-01, sim-02
            elif [[ "$arch_contains_sim" == "1" || "$board_contains_sim" == "1" ]]; then
              if [[ "$board" != *"sim-"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: x86": Build other
            elif [[ "$arch_contains_x86" == "1" || "$board_contains_x86" == "1" ]]; then
              if [[ "$board" != *"other"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: x86_64": Build x86_64-01
            elif [[ "$arch_contains_x86_64" == "1" || "$board_contains_x86_64" == "1" ]]; then
              if [[ "$board" != *"x86_64-"* ]]; then
                skip_build=1
              fi

            # For "Arch / Board: xtensa": Build xtensa-01, xtensa-02, xtensa-03
            elif [[ "$arch_contains_xtensa" == "1" || "$board_contains_xtensa" == "1" ]]; then
              if [[ "$board" != *"xtensa-"* ]]; then
                skip_build=1
              fi

            # For Other Arch: Allow the build
            else
              echo Build by default: $board
            fi

            # Add the board to the selected builds
            if [[ "$skip_build" == "0" ]]; then
              echo Add $board to selected_builds
              if [[ "$selected_builds" == "" ]]; then
                selected_builds=$board
              else
                selected_builds=$selected_builds,$board
              fi
            fi
          done

          # Return the selected builds as JSON Array
          # If Selected Builds is empty: Skip all builds
          echo "selected_builds=[$selected_builds]" | tee -a $GITHUB_OUTPUT
          if [[ "$selected_builds" == "" ]]; then
            echo "skip_all_builds=1" | tee -a $GITHUB_OUTPUT
          fi
    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-936f2a30a261a80c-${{ github.workflow }}-${{ 
        github.sha }}-${{ github.event.schedule || github.event_name }}
      cancel-in-progress: false
      queue: max
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && 'e26d467fab748d329000351728e00aa5e98b721e' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/master' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            35569ed88ab8f24d1411c890e88b8f33d42b4dc08b63fdf20d9fa29fbca6f3c4
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_DEFAULT_PERMISSIONS: read
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
          \    \"\"\"GitHub prefixes callable job names with each caller's display
          name.\"\"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
          INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in job.get(\"\
          steps\", []):\n        if step.get(\"conclusion\") != \"success\":\n   \
          \         continue\n        name = step.get(\"name\", \"\")\n        for
          prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
          \                identity = name.removeprefix(prefix)\n                if
          re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
          \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n  \
          \  if (\n        not parent\n        or parent.get(\"head_branch\") != \"\
          alpha-bridge-ci\"\n        or parent.get(\"status\") != \"completed\"\n\
          \    ):\n        return True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"\
          [0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"parent workflow
          has no exact configuration commit\")\n    record = get(f\"/repos/{repository}\"\
          )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if is_input_check(job) and job.get(\"\
          conclusion\") == \"success\" and input_identity(job)\n    ]\n    return
          not guards or any(\n        job not in guards and job.get(\"conclusion\"\
          ) != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
          run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
          \                            else job[\"name\"] == job_name\n          \
          \              )\n                        and job.get(\"status\") == \"\
          completed\"\n                        and job.get(\"conclusion\") == \"success\"\
          \n                        and input_identity(job) == identity\n        \
          \            ):\n                        return False\n                if
          len(jobs) < 100:\n                    break\n                job_page +=
          1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
          \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"\
          ]\n    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
          }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
          ) as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"default_workflow_permissions\": os.environ[\"AB_DEFAULT_PERMISSIONS\"\
          ],\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
